name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    # A throwaway database, only for this run
    services:
      db:
        image: postgres:18            # match docker-compose.yml
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: workouts_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/workouts_test   # match your scheme
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/workouts_test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"       # match backend/Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest --cov

      - name: Contracts are up to date
        run: git diff --exit-code ../contracts

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24              # match frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint                       # remove this step if there's no "lint" script
        run: npm run lint

      - name: Unit and contract tests
        run: npx vitest run --coverage

      - name: Build
        run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest

    env:
      POSTGRES_PASSWORD: ci          # throwaway, only for this run; Compose fills it into docker-compose.yml

    steps:
      - uses: actions/checkout@v5

      - name: Start the database and the API
        run: docker compose up -d --build --wait db api

      - name: Run migrations
        run: docker compose exec -T api alembic upgrade head

      - name: Wait until the API is ready
        run: curl --fail --retry 10 --retry-connrefused --retry-delay 2 http://localhost:5000/ready

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: No known vulnerabilities in shipped packages
        run: npm audit --omit=dev --audit-level=high

      - name: Install the browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run the journeys
        working-directory: frontend
        run: npm run test:e2e

      - name: Keep the report if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/

  deploy:
    needs: [e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: production          # never two deploys at the same time

    steps:
      - name: Deploy the backend (Render)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl --fail --silent -X POST "$HOOK"

      - name: Wait until the new backend is live
        run: |
          for i in $(seq 60); do
            live=$(curl --silent https://workouts-tracker-7b09.onrender.com/health | jq -r .version)
            echo "Live version: $live"
            [ "$live" = "$GITHUB_SHA" ] && exit 0
            sleep 10
          done
          echo "The new backend did not go live within 10 minutes"
          exit 1

      - name: Deploy the frontend (Vercel)
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: curl --fail --silent -X POST "$HOOK"